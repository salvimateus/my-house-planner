<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Minha Casinha · planta baixa fácil</title>
    <meta
      name="description"
      content="Desenhe a planta baixa da sua casa em minutos: cômodos, portas, janelas e móveis em escala. Exporte em PDF, SVG ou PNG."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3c2c37" media="(prefers-color-scheme: dark)" />
    <script>
      try {
        const t = JSON.parse(localStorage.getItem('casinha:prefs') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Minha Casinha" />
    <meta property="og:title" content="Minha Casinha · planta baixa fácil" />
    <meta
      property="og:description"
      content="Desenhe a planta baixa da sua casa em minutos: cômodos, portas, janelas e móveis em escala."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
