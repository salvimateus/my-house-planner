# Reference config. The Worker is deployed through the Cloudflare API with the same settings.
name = "minha-casinha-plantas"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[r2_buckets]]
binding = "PLANS"
bucket_name = "minha-casinha-prd"

# 30 writes per minute per client IP.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Usage quota: 1 GB stored and 100,000 writes per UTC month, held by one Durable Object.
# The same object also serves the /v1/live hibernatable WebSocket, so no new class is needed.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# GALLERY_KEY is a secret. Set it with `wrangler secret put GALLERY_KEY`; never commit it.
